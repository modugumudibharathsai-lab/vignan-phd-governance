<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VFSTR University Administration Platform | Multi-Agent Core</title>
  
  <!-- Tailwind CSS (Local Vendor File with CDN Fallback) -->
  <script src="/static/vendor/tailwind.js"></script>
  <script>
    if (typeof tailwind === 'undefined') {
      document.write('<script src="https://cdn.tailwindcss.com"><\/script>');
    }
  </script>
  <script>
    if (typeof tailwind !== 'undefined') {
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0f4fe',
                100: '#dde6fd',
                500: '#1d4ed8',
                600: '#1e40af',
                700: '#1e3a8a',
                800: '#172554',
                900: '#0f172a'
              }
            }
          }
        }
      };
    }
  </script>

  <!-- React 18 & ReactDOM (Local Vendor Files with CDN Fallback for Zero-Failure on Mobile Networks) -->
  <script src="/static/vendor/react.min.js"></script>
  <script>
    if (typeof React === 'undefined') {
      document.write('<script src="https://unpkg.com/react@18/umd/react.production.min.js"><\/script>');
    }
  </script>
  <script src="/static/vendor/react-dom.min.js"></script>
  <script>
    if (typeof ReactDOM === 'undefined') {
      document.write('<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"><\/script>');
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
  <script>
    window.onerror = function(msg, url, line) {
      console.error("Global Error:", msg, url, line);
      var errBox = document.getElementById("mobile-diag-box");
      if (!errBox) {
        errBox = document.createElement("div");
        errBox.id = "mobile-diag-box";
        errBox.style = "position:fixed;bottom:0;left:0;right:0;background:#991b1b;color:white;padding:12px;font-size:11px;z-index:999999;font-family:sans-serif;word-break:break-all;";
        document.body ? document.body.appendChild(errBox) : document.addEventListener("DOMContentLoaded", function() { document.body.appendChild(errBox); });
      }
      errBox.innerHTML = "<strong>Error:</strong> " + msg + " (" + line + ")";
    };
  </script>
</head>
<body class="text-slate-800 antialiased selection:bg-blue-100 selection:text-blue-900">
  <div id="root">
    <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;color:white;font-family:sans-serif;text-align:center;padding:24px;">
      <div style="width:44px;height:44px;border:4px solid #3b82f6;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:16px;"></div>
      <h2 style="font-size:18px;font-weight:700;margin:0 0 6px 0;letter-spacing:-0.02em;">VFSTR University Platform</h2>
      <p style="color:#94a3b8;font-size:12px;margin:0;">Initializing multi-agent governance dashboard...</p>
      <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
    </div>
  </div>

  <script src="/static/app.js?v=2.1.0"></script>
</body>
</html>
